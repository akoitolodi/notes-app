name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/notes-app-release.keystore
          echo "Keystore file size: $(stat -c%s android/app/notes-app-release.keystore) bytes"
          echo "Keystore exists: $(test -f android/app/notes-app-release.keystore && echo YES || echo NO)"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "ANDROID_KEYSTORE_PASSWORD set: $(test -n "$ANDROID_KEYSTORE_PASSWORD" && echo YES || echo NO)"
          echo "ANDROID_KEY_ALIAS set: $(test -n "$ANDROID_KEY_ALIAS" && echo YES || echo NO)"
          echo "ANDROID_KEY_PASSWORD set: $(test -n "$ANDROID_KEY_PASSWORD" && echo YES || echo NO)"
          echo "Keystore file exists: $(test -f android/app/notes-app-release.keystore && echo YES || echo NO)"
          cd android && ./gradlew assembleRelease --no-daemon --info

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AI-Class-Notes.apk

      - name: Verify APK signature
        run: |
          echo "APK size: $(stat -c%s AI-Class-Notes.apk) bytes"
          unzip -l AI-Class-Notes.apk | grep -E "META-INF/.*\.(RSA|DSA|EC)" || echo "NO SIGNATURE FILES FOUND"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-class-notes-apk
          path: AI-Class-Notes.apk