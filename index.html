<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f6f3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Notes by Bai" />
    <meta name="description" content="Notes by Bai — class notes that explain themselves as you learn." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>Notes by Bai</title>
    <style>html,body,#root{background-color:var(--boot-bg,#f5f6f3);margin:0;}</style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aicn:theme') || 'auto';
          var preset = localStorage.getItem('aicn:themePreset') || 'default';
          var surfRaw = localStorage.getItem('aicn:surface');
          var surface =
            surfRaw === 'glass-frosted' || surfRaw === 'glass-aurora' || surfRaw === 'studio'
              ? surfRaw
              : 'studio';
          var d = document.documentElement;
          d.dataset.surface = surface;
          var oled =
            t === 'oled' ||
            preset === 'amoled-gold' ||
            (preset === 'default' && t === 'oled');
          var darkPresets = {
            'midnight-ocean': '#071120',
            'catppuccin-mocha': '#181825',
            'tokyo-night': '#131522',
            'forest-night': '#08120c',
            'dracula-plum': '#15111f',
          };
          var lightPresets = {
            'warm-ivory': '#f4f2ec',
            'matcha-sage': '#ecf3ec',
            'blush-quartz': '#f8eef1',
            'sky-paper': '#ecf3fb',
            'paper-mint': '#ebf5f2',
          };
          var dark =
            oled ||
            Boolean(darkPresets[preset]) ||
            (!lightPresets[preset] &&
              (t === 'dark' ||
                (t === 'auto' &&
                  window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches)));
          if (darkPresets[preset]) {
            d.dataset.theme = 'dark';
            d.dataset.themePreset = preset;
          } else if (lightPresets[preset]) {
            d.dataset.theme = 'light';
            d.dataset.themePreset = preset;
          } else if (oled) {
            d.dataset.theme = 'dark';
            d.dataset.oled = 'true';
          } else if (t !== 'auto') {
            d.dataset.theme = t;
          }
          var bg = oled
            ? '#000000'
            : darkPresets[preset] ||
              lightPresets[preset] ||
              (dark ? '#0a0e14' : '#f5f6f3');
          d.style.backgroundColor = bg;
          d.style.setProperty('--boot-bg', bg);
          if (window.BaiNativeTheme && window.BaiNativeTheme.getSafeInsetsJson) {
            try {
              var ins = JSON.parse(window.BaiNativeTheme.getSafeInsetsJson());
              if (ins) {
                d.style.setProperty('--native-safe-top', (ins.top || 0) + 'px');
                d.style.setProperty('--native-safe-bottom', (ins.bottom || 0) + 'px');
                d.style.setProperty('--native-safe-left', (ins.left || 0) + 'px');
                d.style.setProperty('--native-safe-right', (ins.right || 0) + 'px');
              }
            } catch (e2) {}
          }
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
